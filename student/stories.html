<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>번호와 이름</title>
  <link rel="stylesheet" href="../css/common.css?v=20261126a">
  <link rel="stylesheet" href="../css/stories.css?v=20261126a">
</head>
<body>
  <main class="container pick-main">
    <header class="page-header">
      <a class="btn btn-ghost" href="../index.html">← 모둠 다시 고르기</a>
      <span class="student-badge"></span>
    </header>

    <!-- 우리 모둠이 맡은 이야기 (js/stories.js 가 data/stories/storyN.json 을 읽어 채움) -->
    <section class="our-story" id="ourStory" aria-labelledby="ourStoryTitle">
      <div class="our-story-thumb" id="ourStoryThumb"></div>
      <div class="our-story-text">
        <p class="our-story-label" id="ourStoryLabel">우리 모둠이 맡은 이야기</p>
        <h2 class="our-story-title" id="ourStoryTitle">이야기를 불러오는 중…</h2>
        <p class="our-story-intro" id="ourStoryIntro"></p>
      </div>
    </section>

    <form class="card pick-form" id="pickForm" novalidate>
      <fieldset class="pick-numbers">
        <legend class="pick-title">① 내 번호를 골라요</legend>
        <div class="number-grid" id="numberGrid" aria-live="polite">
          <!-- js/stories.js 가 1~5번 버튼을 만듭니다 -->
        </div>
        <p class="pick-error" id="numberError" hidden>번호를 골라 주세요.</p>
      </fieldset>

      <label class="pick-name">
        <span class="pick-title">② 내 이름을 적어요 <small>(성 빼고 이름만)</small></span>
        <input class="input name-input" id="nameInput" type="text" maxlength="10" autocomplete="off"
          placeholder="예) 서연" aria-describedby="nameError">
        <span class="pick-error" id="nameError" hidden>이름을 1~10자로 적어 주세요.</span>
      </label>

      <div class="pick-actions">
        <button type="button" class="btn btn-ghost pick-thought" id="thoughtBtn" hidden>✏️ 내 생각 쓰러 가기</button>
        <button type="submit" class="btn btn-primary pick-go" id="goBtn">📖 이야기 읽으러 가기</button>
      </div>
    </form>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/db.js?v=20261126a"></script>
  <script src="../js/common.js?v=20261126a"></script>
  <script src="../js/stories.js?v=20261126a"></script>
</body>
</html>

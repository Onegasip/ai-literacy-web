<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>모둠 생각 모으기</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/group.css">
</head>
<body>
  <main class="container group-main">
    <header class="page-header">
      <h1 class="group-title" id="groupTitle">모둠 생각 모으기</h1>
      <span class="student-badge"></span>
    </header>

    <!-- 위쪽: 이야기 1~4별 친구 생각 (보기만) -->
    <section aria-labelledby="membersTitle">
      <h2 class="section-title" id="membersTitle">친구들이 찾은 AI의 장점과 한계</h2>
      <div class="member-grid" id="memberGrid" aria-live="polite">
        <!-- js/group.js 가 1~4번 카드를 만듭니다 -->
      </div>
      <p class="refresh-note muted">친구가 저장하면 바로 보여요.</p>
    </section>

    <!-- 아래쪽: 모둠 공동 정리 (1번만 입력) -->
    <section class="card summary-card" aria-labelledby="summaryTitle">
      <h2 class="section-title" id="summaryTitle">우리 모둠이 찾은 AI의 장점 / 한계</h2>
      <p class="recorder-note" id="recorderNote"></p>

      <form id="summaryForm" novalidate>
        <label class="field">
          <span class="field-label strength">👍 우리 모둠이 찾은 AI의 장점</span>
          <textarea class="textarea" id="strength" maxlength="300"
            placeholder="예) 친구들 생각을 모아 보니, AI는 ○○을 잘해요."></textarea>
          <span class="field-error" id="strengthError" hidden>장점을 적어 주세요.</span>
        </label>

        <label class="field">
          <span class="field-label limit">🤔 우리 모둠이 찾은 AI의 한계</span>
          <textarea class="textarea" id="limit" maxlength="300"
            placeholder="예) 친구들 생각을 모아 보니, AI는 ○○을 어려워해요."></textarea>
          <span class="field-error" id="limitError" hidden>한계를 적어 주세요.</span>
        </label>

        <div class="summary-actions">
          <span class="save-state" id="saveState" aria-live="polite"></span>
          <button type="submit" class="btn btn-primary save-btn" id="saveBtn">모둠 정리 저장하기</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/group.js"></script>
</body>
</html>

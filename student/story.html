<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이야기 보기</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/story.css">
</head>
<body>
  <main class="container story-main">
    <header class="page-header story-header">
      <a class="btn btn-ghost" href="stories.html">← 이야기 다시 고르기</a>
      <span class="story-progress" id="progress" aria-live="polite"></span>
      <span class="student-badge"></span>
    </header>

    <h1 class="story-title" id="storyTitle"></h1>
    <div class="progress-bar" id="progressBar" hidden><span id="progressFill"></span></div>

    <!-- 장면 모드 (mode: "scenes") — 이 영역 아무 곳이나 누르면 다음 장면 -->
    <section class="scene-stage" id="sceneStage" hidden>
      <div class="scene-media" id="sceneMedia"></div>
      <div class="scene-talk">
        <span class="speaker-tag" id="speakerTag"></span>
        <p class="scene-text" id="sceneText"></p>
      </div>
      <p class="tap-hint" id="tapHint">화면을 누르면 다음 장면으로 넘어가요</p>
    </section>

    <!-- 영상 모드 (mode: "video") -->
    <section class="video-stage" id="videoStage" hidden>
      <div class="scene-media" id="videoMedia"></div>
    </section>

    <!-- 불러오기 실패 -->
    <section class="card center" id="errorBox" hidden>
      <p class="error-text">이야기를 불러오지 못했어요.</p>
      <a class="btn btn-primary" href="stories.html">이야기 다시 고르기</a>
    </section>

    <nav class="story-nav" id="storyNav" hidden>
      <button type="button" class="btn btn-ghost nav-btn" id="prevBtn">◀ 이전</button>
      <button type="button" class="btn btn-primary nav-btn" id="nextBtn">다음 ▶</button>
      <button type="button" class="btn btn-primary nav-btn finish-btn" id="finishBtn" hidden>AI의 장점과 한계 적으러 가기 ✏️</button>
    </nav>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/story.js"></script>
</body>
</html>

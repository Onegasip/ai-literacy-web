<!DOCTYPE html>
<html lang="ko" class="teacher">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>AI 능력과 한계 정리</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/summary.css">
</head>
<body class="teacher">
  <main class="container fit-screen board-main">
    <nav class="teacher-nav" aria-label="교사 메뉴">
      <a class="tab" href="results.html">결과</a>
      <a class="tab" href="summary.html" aria-current="page">정리</a>
      <a class="tab" href="judge.html">AI 활용 판단</a>
      <h1 class="summary-title">AI의 능력과 한계 정리</h1>
      <span class="nav-spacer"></span>
      <button type="button" class="btn btn-ghost" id="exampleBtn">참고 예시 보기</button>
      <button type="button" class="btn btn-ghost" id="presentBtn" aria-pressed="false">발표 모드</button>
      <a class="btn btn-ghost" href="../index.html">처음 화면</a>
    </nav>

    <!-- 판서: 교사가 아래 입력 줄로 적은 능력·한계 항목 + 오늘의 핵심 문장 (DB board/summary, 실시간) -->
    <div class="board fit-fill" id="board" aria-live="polite">
      <section class="board-col col-ability" aria-labelledby="abilityTitle">
        <h2 class="col-title" id="abilityTitle">👍 AI의 능력 <small>(잘하는 것)</small></h2>
        <ol class="board-list" id="abilityList" data-col="abilities"></ol>
      </section>
      <section class="board-col col-limit" aria-labelledby="limitTitle">
        <h2 class="col-title" id="limitTitle">🤔 AI의 한계 <small>(어려워하는 것)</small></h2>
        <ol class="board-list" id="limitList" data-col="limits"></ol>
      </section>
      <button type="button" class="conclusion-board" id="conclusionView" aria-label="오늘의 핵심 문장 (누르면 고치기)">
        <span class="conclusion-label">💡 오늘의 핵심 문장</span>
        <span class="conclusion-text" id="conclusionText"></span>
      </button>
    </div>

    <!-- 입력 줄 (화면 아래, 작게) — [발표 모드]에서는 숨김 -->
    <form class="entry" id="entryForm" novalidate>
      <div class="entry-seg" role="radiogroup" aria-label="어디에 적을까요">
        <button type="button" class="seg-btn seg-ability" data-col="abilities" role="radio" aria-checked="true">능력</button>
        <button type="button" class="seg-btn seg-limit" data-col="limits" role="radio" aria-checked="false">한계</button>
        <button type="button" class="seg-btn seg-conclusion" data-col="conclusion" role="radio" aria-checked="false">핵심 문장</button>
      </div>
      <input class="input entry-keyword" id="entryKeyword" type="text" maxlength="30" autocomplete="off"
        placeholder="키워드 (꼭 적기)" aria-label="키워드">
      <input class="input entry-desc" id="entryDesc" type="text" maxlength="80" autocomplete="off"
        placeholder="짧은 설명 (선택)" aria-label="짧은 설명">
      <div class="entry-tags" id="entryTags" role="group" aria-label="관련 모둠 (선택)">
        <!-- js/summary.js 가 1~4모둠 태그 버튼을 만듭니다 -->
      </div>
      <button type="button" class="btn btn-ghost entry-cancel" id="entryCancel" hidden>취소</button>
      <button type="submit" class="btn btn-primary entry-add" id="entryAdd">추가</button>
    </form>
  </main>

  <!-- 참고 예시 (data/summary.json) — 교사만, 기본 숨김 -->
  <div class="modal-overlay example-overlay" id="exampleModal" hidden>
    <section class="example" role="dialog" aria-modal="true" aria-labelledby="exampleTitle">
      <header class="example-head">
        <h2 id="exampleTitle">참고 예시</h2>
        <div class="example-tools">
          <button type="button" class="btn btn-ghost" id="showAllBtn">모두 보기</button>
          <button type="button" class="btn btn-ghost" id="hideAllBtn">모두 가리기</button>
          <button type="button" class="btn btn-ghost" id="exampleClose">닫기 ✕</button>
        </div>
      </header>
      <p class="error-text" id="errorText" hidden>참고 예시(data/summary.json)를 불러오지 못했어요.</p>
      <div class="example-body">
        <div class="summary-cols">
          <section class="summary-col col-ability">
            <h3 class="ex-col-title">👍 AI의 능력</h3>
            <ol class="reveal-list" id="exampleAbilities"></ol>
          </section>
          <section class="summary-col col-limit">
            <h3 class="ex-col-title">🤔 AI의 한계</h3>
            <ol class="reveal-list" id="exampleLimits"></ol>
          </section>
        </div>
        <div id="exampleConclusion"></div>
      </div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/summary.js"></script>
</body>
</html>
